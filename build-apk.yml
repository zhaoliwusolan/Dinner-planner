name: Build APK

# 三种触发方式：网页手动点、推送代码自动跑、发布 Release 自动跑
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 摆放构建配置到仓库根目录
        run: |
          test -f build-configs/package.json && cp -f build-configs/package.json package.json || echo "package.json 已在根目录"
          test -f build-configs/capacitor.config.json && cp -f build-configs/capacitor.config.json capacitor.config.json || echo "capacitor.config.json 已在根目录"
          ls -la

      - name: 把网页放入 www
        run: |
          mkdir -p www
          cp -f index.html www/index.html
          ls -la www/

      - name: 安装依赖
        run: |
          if [ ! -f package.json ]; then echo "缺少 package.json，请按 README 放在 build-configs/ 或仓库根目录"; exit 1; fi
          npm install
        continue-on-error: false

      - name: 添加 Android 平台（仅首次需要）
        run: npx cap add android
        continue-on-error: true

      - name: 同步网页到原生工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 整理产物文件名
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dinner-planner.apk
          ls -lh dinner-planner.apk

      - name: 上传 APK（在 Actions 运行页面底部 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: dinner-planner-apk
          path: dinner-planner.apk
          if-no-files-found: error
          retention-days: 90

      # 若由 Release 触发，则把 apk 直接作为附件挂到该 Release 上，方便微信分享下载链接
      - name: 发布到 Release（仅 Release 触发时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dinner-planner.apk
